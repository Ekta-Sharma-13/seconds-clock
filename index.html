<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seconds Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,400;0,700;1,100;1,200;1,300;1,600&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <div id="logo">SecondsClock</div>
            <ul class="nav">
                <li class="day"></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <div class="clock">

        </div>
        <div class="calender">

        </div>
        <div class="timeFormatChanger">
            24-Hour Format
            <label class="switch">
                <input type="checkbox" id="toggleBtnTime">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
